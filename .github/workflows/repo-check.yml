name: repo-check

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'schema/**'
      - 'tools/**'
  push:
    branches: [main]
  workflow_dispatch:

# 注意：不要把本 workflow 设为分支保护的 required check。
# GitHub 对因 paths 过滤而跳过的运行会让检查停留在 Pending，
# 只改代码的 PR 会因此永远无法合并（官方文档 "checks ... will remain in a Pending state"）。

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Doc dependencies
        # 本仓没有 requirements.txt（PowerShell 部署包）：显式装文档检查依赖。
        run: python -m pip install "PyYAML>=6.0" "markdown-it-py>=3.0" "jsonschema>=4.20"
      - name: Invariants
        run: python tools/repo-kit/check_repo.py --root .
      - name: Text rules
        # BOM / 行尾铁律。此前只在 AGENTS.md「常用命令」里，没人跑，红了半年没发现。
        # kit 托管文件由 schema/kit.lock.json 豁免（它们归上游，改了就 KIT LOCK 红）。
        run: python tools/check_text.py
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check

# ⚠️ 这是 CI 的**模板**，不是生效的 workflow。
#
# 为什么没放在 .github/workflows/ 下：GitHub 规定「创建或更新 workflow 文件」的 PAT
# 必须带 `workflow` scope，而本机手上的两个 PAT 都只有 `repo` —— 推上去会被拒：
#   ! [remote rejected] main -> main (refusing to allow a Personal Access Token to
#     create or update workflow `.github/workflows/ci.yml` without `workflow` scope)
#
# 激活方式（二选一，都不需要改代码）：
#   A. 换个带 repo + workflow scope 的 PAT，然后：
#        git mv .github/ci-workflow.yml .github/workflows/ci.yml
#        git commit -m "ci: 启用 GitHub Actions" && git push
#   B. 在网页上直接建：GitHub → Add file → Create new file →
#        路径填 .github/workflows/ci.yml，把本文件内容（去掉这段注释）粘进去 → Commit。
#
# 内容本身已在本地验证过：两套用例、pylint -E、vulture、文字规范四项都能跑通。

name: ci

# 这个仓库原本没有任何自动化检查，全靠"改完记得跑那五件事"。
# 现在把能在 Linux 上跑的三件固定下来：纯函数用例、静态检查、文字规范（BOM / 行尾）。
# 跑不了的两件（界面截图、exe 冒烟）留在 launcher/tests/manual/，发版前手动跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: 用例（py${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 启动器：46 个纯函数用例，不依赖 tkinter（这正是它们能在 Linux 上跑的原因）
      - name: 启动器用例
        run: python -m unittest discover -s launcher/tests -v

      # 方案四 VEHelper：17 个用例，同样不依赖 tkinter / sv-ttk。
      # ⚠️ 必须在该子目录下跑：它们 `import vehelper`（包相对导入），
      #    在仓库根跑会 ModuleNotFoundError（本地实测 4 errors）。
      - name: VEHelper 用例
        working-directory: 04-VisualEnhancer
        run: python -m unittest discover -s tests -v

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 版本固定：pylint 小版本之间规则会变，浮动版本会让 CI 忽然变红
      - name: 装检查工具
        run: python -m pip install --disable-pip-version-check "pylint==4.1.3" "vulture==2.16"

      - name: pylint（只看错误级 E）
        working-directory: launcher
        run: python -m pylint --disable=all --enable=E *.py tests/*.py

      - name: vulture（死代码，置信度 80%）
        working-directory: launcher
        run: python -m vulture *.py --min-confidence 80

      - name: 文字规范（.ps1 的 BOM + 仓库内不得存 CRLF）
        run: python .github/scripts/check_text.py
